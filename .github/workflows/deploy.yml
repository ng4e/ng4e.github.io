name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `develop` branch
  push:
    branches: [develop]
  # Allow you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Explicit steps rather than withastro/action@v3, whose single step builds *and* uploads:
      # the checks must run before anything is uploaded.
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      # Lighthouse drives the Google Chrome preinstalled on the ubuntu-latest image.
      - name: Chrome for Lighthouse
        run: google-chrome --version
      - name: Check dist/ and Lighthouse (a failure stops the deploy)
        run: npm run check
      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
